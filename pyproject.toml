[project]
name = "fastapi-se-deep-dive"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Caio Semblano", email = "semblanocaio@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "fastapi[standard]>=0.161.1",
    "typos>=1.51.1",
]

[project.scripts]
fastapi-se-deep-dive = "fastapi_se_deep_dive:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.2",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
]

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.pytest]
pythonpath = ['.']
addopts = ['-p', 'no:warnings', '--cov=fast_zero', '--cov-context=test']

[tool.typos.files]
extend-exclude = ["*.md", "migrations"]
